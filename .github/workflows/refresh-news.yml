# Scheduled ingestion for the Robotics News feed (Phase 1b).
#
# Pulls recent posts from approved accounts and commits an updated
# frontend/public/data/news-posts.json, which triggers the static-site redeploy.
#
# SAFE BY DEFAULT: with no secrets configured the script is a no-op (see
# frontend/scripts/refresh-news.mjs), so this workflow will simply find no
# changes and push nothing. To enable automation, set the repository variable
# NEWS_PROVIDER ("x" or "twitterapi_io") and the matching secret
# (X_BEARER_TOKEN or TWITTERAPI_IO_KEY).

name: Refresh robotics news

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch: {}

concurrency:
  group: refresh-news
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh feed
        env:
          NEWS_PROVIDER: ${{ vars.NEWS_PROVIDER }}
          NEWS_MAX_PER_ACCOUNT: ${{ vars.NEWS_MAX_PER_ACCOUNT }}
          NEWS_FULL_SYNC: ${{ vars.NEWS_FULL_SYNC }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: node frontend/scripts/refresh-news.mjs

      - name: Commit updated feed
        run: |
          if [ -n "$(git status --porcelain frontend/public/data/news-posts.json frontend/public/data/news-sources.json)" ]; then
            git config user.name "robofounders-bot"
            git config user.email "bot@robofounders.ai"
            git add frontend/public/data/news-posts.json frontend/public/data/news-sources.json
            git commit -m "chore(news): refresh robotics news feed [skip ci]"
            git push
          else
            echo "No feed changes."
          fi
